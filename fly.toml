app = "joyous-demo-api-samk"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.api"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "4000"
  DATABASE_SSL_MODE = "require"
  OPENAI_MODEL = "gpt-5.6-luna"
  OPENAI_TIMEOUT_MS = "20000"
  OPENAI_MAX_RETRIES = "0"
  LOG_LEVEL = "info"

[deploy]
  release_command = "sh -c 'node backend/dist/db/migrate.js && node backend/dist/db/seed.js'"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
